services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: brokerportal
      POSTGRES_USER: brokerportal
      POSTGRES_PASSWORD: brokerportal
    # 5434 so it doesn't clash with other local Postgres instances
    ports:
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  # the full app on http://localhost:8080 with demo data: docker compose --profile app up --build
  app:
    profiles: [app]
    build: .
    depends_on: [db]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      SPRING_PROFILES_ACTIVE: demo
    ports:
      - "8080:8080"

volumes:
  db-data:
