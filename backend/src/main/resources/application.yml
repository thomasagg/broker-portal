server:
  port: ${PORT:8080}

spring:
  application:
    name: broker-portal
  autoconfigure:
    # we check passwords ourselves and hand out JWTs, no in-memory default user
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:brokerportal}
    username: ${DB_USER:brokerportal}
    password: ${DB_PASSWORD:brokerportal}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  zone: Europe/Athens
  # HS256 needs at least 32 bytes; the default is only for local runs
  jwt-secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
  jwt-ttl: 8h
